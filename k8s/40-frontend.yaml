apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: loantrack
  labels:
    app.kubernetes.io/name: loantrack
    app.kubernetes.io/component: frontend
    app: frontend
spec:
  # NodePort allows direct access from minikube IP on port 30080 without cloud load balancers
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
  selector:
    app: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: loantrack
  labels:
    app.kubernetes.io/name: loantrack
    app.kubernetes.io/component: frontend
    app: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: loantrack
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        # Enforces non-root execution (Nginx unprivileged image runs as user nginx UID 101)
        runAsNonRoot: true
      containers:
        - name: frontend
          image: loantrack-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
