# Example Kubernetes Secret Template
# WARNING: NEVER commit real credentials or actual secret manifests to version control.
# Real secret is generated directly from .env via:
#   kubectl -n loantrack create secret generic db-credentials \
#     --from-literal=POSTGRES_USER="$POSTGRES_USER" \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: loantrack
  labels:
    app.kubernetes.io/name: loantrack
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  POSTGRES_USER: "loantrack_user"
  POSTGRES_PASSWORD: "change_me_dummy"
