# Nginx Unprivileged Reverse Proxy Configuration
# Listens on non-root port 8080
# Proxies /api/ requests to http://backend:8000/
# Serves static assets for all other routes

server {
    listen 8080;
    server_name localhost;

    # Static HTML/CSS/JS frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy routing to Flask backend
    # Enforces Hard Rule 1: frontend never holds database drivers or credentials
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
