<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoanTrack — Portfolio Operations</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --border: #d2d2d7;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --radius: 12px;
      --badge-approved-bg: #e3f9e5;
      --badge-approved-text: #1b5e20;
      --badge-pending-bg: #fff8e1;
      --badge-pending-text: #b78103;
      --badge-rejected-bg: #ffebee;
      --badge-rejected-text: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    p.subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* Form Layout */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    input, select {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background-color: #fff;
      color: var(--text-main);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }

    button.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      padding: 0 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button.btn:hover {
      background: var(--accent-hover);
    }

    button.btn:active {
      transform: scale(0.97);
    }

    /* Table */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      padding: 12px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #ebebed;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-APPROVED { background: var(--badge-approved-bg); color: var(--badge-approved-text); }
    .badge-PENDING { background: var(--badge-pending-bg); color: var(--badge-pending-text); }
    .badge-REJECTED { background: var(--badge-rejected-bg); color: var(--badge-rejected-text); }

    .amount {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    /* Feedback Banner */
    .banner {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .banner.success {
      background: var(--badge-approved-bg);
      color: var(--badge-approved-text);
      display: block;
    }

    .banner.error {
      background: var(--badge-rejected-bg);
      color: var(--badge-rejected-text);
      display: block;
    }

    /* Footer Metadata */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 16px 4px;
      border-top: 1px solid var(--border);
      margin-top: 24px;
    }

    .metadata-pill {
      background: #e8e8ed;
      padding: 4px 10px;
      border-radius: 12px;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>LoanTrack</h1>
      <p class="subtitle">Commercial and residential loan portfolio ledger</p>
    </header>

    <div id="feedbackBanner" class="banner"></div>

    <!-- Loan Creation Form -->
    <section class="card">
      <h2 class="card-title">Originate New Loan</h2>
      <form id="loanForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="borrowerName">Borrower Name</label>
            <input type="text" id="borrowerName" placeholder="e.g. Acme Corp" required>
          </div>
          <div class="form-group">
            <label for="loanAmount">Loan Amount ($)</label>
            <input type="number" id="loanAmount" step="0.01" min="1" placeholder="e.g. 500000" required>
          </div>
          <div class="form-group">
            <label for="propertyCity">Property City</label>
            <input type="text" id="propertyCity" placeholder="e.g. Chicago">
          </div>
          <div class="form-group">
            <label for="loanStatus">Initial Status</label>
            <select id="loanStatus">
              <option value="PENDING" selected>PENDING</option>
              <option value="APPROVED">APPROVED</option>
              <option value="REJECTED">REJECTED</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn" id="submitBtn">Submit Application</button>
      </form>
    </section>

    <!-- Loans Ledger Table -->
    <section class="card">
      <h2 class="card-title">Portfolio Loans</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Borrower</th>
              <th>Amount</th>
              <th>City</th>
              <th>Status</th>
              <th>Origination Date</th>
            </tr>
          </thead>
          <tbody id="loansTableBody">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted);">Loading portfolio records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Runtime Deployment Info -->
    <footer>
      <span>LoanTrack Microservices Ledger</span>
      <span class="metadata-pill" id="runtimeInfo">served_by: connecting... | version: ...</span>
    </footer>
  </div>

  <script>
    const loansTableBody = document.getElementById('loansTableBody');
    const loanForm = document.getElementById('loanForm');
    const feedbackBanner = document.getElementById('feedbackBanner');
    const runtimeInfo = document.getElementById('runtimeInfo');
    const submitBtn = document.getElementById('submitBtn');

    function formatCurrency(val) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
      }).format(val);
    }

    function showBanner(text, type = 'success') {
      feedbackBanner.textContent = text;
      feedbackBanner.className = `banner ${type}`;
      setTimeout(() => {
        feedbackBanner.className = 'banner';
      }, 4000);
    }

    async function fetchLoans() {
      try {
        const response = await fetch('/api/loans');
        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }
        const data = await response.json();
        renderLoans(data.loans || []);
        runtimeInfo.textContent = `served_by: ${data.served_by || 'unknown'} | version: ${data.version || 'unknown'}`;
      } catch (err) {
        loansTableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--badge-rejected-text);">Failed to load loans: ${err.message}</td></tr>`;
        runtimeInfo.textContent = 'served_by: disconnected | version: n/a';
      }
    }

    function renderLoans(loans) {
      if (!loans || loans.length === 0) {
        loansTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No loans recorded yet.</td></tr>';
        return;
      }

      loansTableBody.innerHTML = loans.map(loan => {
        const dateStr = loan.created_at ? new Date(loan.created_at).toLocaleDateString() : 'N/A';
        const statusClass = `badge-${loan.status}`;
        return `
          <tr>
            <td><strong>#${loan.id}</strong></td>
            <td>${escapeHtml(loan.borrower_name)}</td>
            <td class="amount">${formatCurrency(loan.loan_amount)}</td>
            <td>${escapeHtml(loan.property_city || '—')}</td>
            <td><span class="badge ${statusClass}">${loan.status}</span></td>
            <td>${dateStr}</td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loanForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;

      const payload = {
        borrower_name: document.getElementById('borrowerName').value.trim(),
        loan_amount: parseFloat(document.getElementById('loanAmount').value),
        property_city: document.getElementById('propertyCity').value.trim(),
        status: document.getElementById('loanStatus').value,
      };

      try {
        const response = await fetch('/api/loans', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `Failed with status ${response.status}`);
        }

        const data = await response.json();
        showBanner(`Successfully originated loan #${data.loan.id} for ${data.loan.borrower_name}`, 'success');
        loanForm.reset();
        await fetchLoans();
      } catch (err) {
        showBanner(`Error submitting loan: ${err.message}`, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Initial load
    fetchLoans();
  </script>
</body>
</html>
